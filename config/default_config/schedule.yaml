pushHour: 20
showTableName: true
autoRecallCode: false
renderScale: 1.0
renderRestartCount: 100
maxRenderRetry: 1
renderTimeOut: 10000
# 图片渲染器：
#   puppeteer 插件独立浏览器实例（默认，兼容性最好，上方渲染参数全部生效）
#   shotium   复用宿主 TRSS-Yunzai 的共享 Shotium 引擎，插件不再维护独立浏览器，内存占用更低、渲染更快；
#             渲染精度跟随宿主 renderers/shotium 的 scale 配置，仅渲染超时时间生效
#   auto      宿主存在可用 Shotium 渲染器时自动使用，否则回退 puppeteer
renderer: "puppeteer"
autoCancelCheckEnabled: false    
autoCancelCheckInterval: 60
# 上课提醒功能总开关（管理员可全局禁用，默认关闭，用户需手动开启）
classReminderEnabled: false
# 上课提醒扫描间隔（分钟），精度越高提醒越准时，默认1分钟
classReminderScanInterval: 1
# 调试模式：开启后会打印高频扫描等详细日志（默认关闭，避免刷屏）
debugMode: false
birthdayPushHour: 0
allowSelfModify: true
birthdayWhitelistGroups: []
birthdayBlacklistGroups: []
# WakeUp 课程表服务基础URL
# 默认使用公共服务，也可以配置自己的服务地址
wakeupServiceUrl: "https://wakeup.cpc.cn.eu.org/"
# WakeUp API端点路径
wakeupApiEndpoint: "/parse"
# WakeUp 服务鉴权方式: Bearer / X-Auth-Token / None
wakeupAuthType: "None"
# WakeUp 服务鉴权 Token，留空则不进行鉴权
wakeupAuthToken: ""
# 默认学期开始日期
defaultSemesterStart: "2026-08-31"
# 自定义bot名称
botName: ""
# 字体风格
font: "像素"
# 群课表排序方式 userId：按QQ号；courseStatus：按上课状态；
# timeDistance：先按状态分组（上课中/分身中/翘课中 → 未开始 → 其他），组内按距上/下课时间升序
sortMode: "userId"
# 群课表图片每行展示的成员列数：
#   2 / 3 / 4  固定列数（列数只改变图片宽度与行数，单卡宽度与字号保持不变）
#   "auto"     按整图宽高比自动选列数，尽量接近 2:3（宽:高）；
#              本布局下约 14 人以内 2 列、15~30 人 3 列、31 人以上 4 列
scheduleColumns: 2
# 群课表头像边框展示方式：
#   progress  上课中用「上课进度」进度环（空 → 满，同色系深浅双色），其他状态用淡化的状态色边框
#   solid     所有状态都用淡化的状态色边框
#   off       关闭（白色细边框）
# 也可用管理员命令 #课表头像边框 进度|实色|关闭 切换（会写入本文件）
avatarBorderMode: "progress"
# 「所有人课表」（#所有人在上什么课 / #全局课表）的使用权限：
#   owner       仅 Bot 主人
#   ownerAdmin  Bot 主人 + 群主/群管理员（默认，与旧版一致）
#   everyone    所有人（含私聊）
allSchedulePermission: "ownerAdmin"
# 「所有人课表」的隐藏策略（只作用于该命令，#clstb 群课表不受影响）：
#   everyone   所有人看到脱敏版
#   nonMaster  非 Bot 主人看到脱敏版（默认）
#   off        都不隐藏
# 脱敏内容：非本群群友的头像、昵称、教室（地点）高斯模糊（本群群友照常显示，教室行照旧输出不占空白），
#          头像模糊套在裁剪遮罩内，不会越出边框或透出进度环底色；拿不到本群成员列表时按非本群处理
allSchedulePrivacy: "nonMaster"
# 群课表图片中隐藏学期已结束超过该天数的成员，设置为 0 表示不过滤
hideEndedDays: 30
# 生日列表是否展示QQ号
showQQ: true
# 监听所有文件以尝试自动导入课表
watchFiles: false
# URL直链导入总开关（#导入课表 <直链> / 上下文发送直链）。
# 插件内置安全防护：仅允许公网 http/https 直链（80/443端口），拒绝内网/回环/链路本地地址与重定向降级，
# 限制文件大小2MB、请求超时20秒、重定向不超过3跳
urlImportEnabled: true
# 生日列表允许使用自定义昵称，关闭则同步QQ昵称
birthdayCustomName: true
# ===== 全局群黑白名单 =====
# 命中的群聊本插件「完全不响应」（不回复任何提示，也不影响其他插件工作）
# 白名单为空 = 不限制；白名单非空时只有白名单内的群可用（白名单优先）
# 群号按字符串填写；官方Bot的复合群ID（形如 botUin:OpenID）同样支持
groupWhitelist: []
groupBlacklist: []
# ===== 日历同步（把用户自己的手机日历拉进课表，事件表现为「活动」）=====
# 方向是「拉取」：用户在手机/电脑日历里增删改 → 定时拉取 → 课表里的活动随之更新
# 支持 CalDAV 账号（Nextcloud / Radicale / Zimbra / 腾讯企业邮 等）与 ICS 订阅链接
# （Exchange/Outlook 的「发布日历」链接、iCloud 共享链接、学校导出的 .ics）
calendarSyncEnabled: false      # 定时同步总开关（关闭时仍可用 #日历同步 手动同步）
calendarSyncInterval: 30        # 定时同步间隔（分钟）
calendarSyncDaysBefore: 7       # 同步窗口：向前 N 天
calendarSyncDaysAfter: 60       # 同步窗口：向后 N 天
calendarMaxEvents: 150          # 单次最多拉取事件数（活动总数上限 200）
calendarAllowPrivateHost: false # 允许绑定内网/本机日历地址（自建 CalDAV 时才需要打开）
# ===== 插件更新 =====
# 「#课表更新」使用的分支：留空 = 跟随插件当前所在分支；
# 填了别的分支（如 main / EchoDev / MoistDev）会先切过去再更新，可在 Guoba 里直接选
updateBranch: ""
